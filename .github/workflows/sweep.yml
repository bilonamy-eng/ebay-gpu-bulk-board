name: eBay API bulk sweep
on:
  schedule:
    - cron: "*/5 * * * *"   # 每小时两次检查；只有行情板仓库有新一轮数据时才更新，不调用 eBay API
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sweep
  cancel-in-progress: false
jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: bilonamy-eng/ebayGPU_Price
          path: src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render bulk board from the latest shared sweep
        run: |
          cp src/sweep.py sweep.py
          python3 sweep.py --bulk --board --from-json=src/api_sweep_latest.json
      - name: Commit board
        run: |
          git add index.html
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update bulk board $(TZ=Europe/Amsterdam date '+%Y-%m-%d %H:%M') (Amsterdam) via eBay API"
          git push
